<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heart Landing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #ff3366;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .header {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 17px;
      letter-spacing: 3px;
      color: #ff3366;
      text-shadow: 0 0 10px #ff3366;
      z-index: 100;
    }

    .status {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
      text-align: center;
      width: 90%;
      z-index: 100;
    }

    .heart-container {
      position: relative;
      width: 100vw;
      max-width: 520px;
      height: 460px;
      margin: 0 auto;
    }

    .word {
      position: absolute;
      color: #ff4d6d;
      font-size: 15.5px;
      text-shadow: 0 0 10px #ff6699;
      white-space: nowrap;
      opacity: 0;
      user-select: none;
      font-weight: 500;
    }

    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 30px #ff3366,
                   0 0 60px #ff3366,
                   0 0 90px #ff3366;
      z-index: 10;
      opacity: 0;
      animation: glow 2.5s forwards 4.2s;
    }

    .cat {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      border-radius: 20px;
      z-index: 200;
      opacity: 0;
      animation: fadeInCat 2s forwards 5s;
    }

    @keyframes glow {
      to { opacity: 1; }
    }

    @keyframes fadeInCat {
      to { opacity: 1; }
    }

    
    @media (max-width: 480px) {
      .header { font-size: 10px; top: 12px; }
      .status { font-size: 13.5px; top: 55px; }
      .center-text { font-size: 28px; }
      .heart-container { height: 420px; }
      .word { font-size: 10px; }
      .cat { width: 100px; bottom: 15px; }
    }

    @media (max-width: 360px) {
      .center-text { font-size: 34px; }
      .word { font-size: 12.8px; }
    }
  </style>
</head>
<body>

  <div class="header">HEART LANDING</div>
  <div class="status" id="status"></div>
  
  <div class="heart-container" id="heart"></div>
  <div class="center-text">Сашенька</div>

  <img class="cat" src="https://i.pinimg.com/736x/7d/13/74/7d1374409e2e97805276140c23a3f635.jpg" alt="jf">

  <script>
    const statusEl = document.getElementById('status');
    const heartEl = document.getElementById('heart');

    const messages = [
      "[system] Инициализация heart.PROTOCOL_v2.0...",
      "> Для вас найдено одно зашифрованное сообщение.",
      "[status] РАСШИФРОВКА СООБЩЕНИЯ...",
      "[status] Завершенна зашифровка heart.PROTOCOL_v2.0",
      "[message] Сашенька как станет грустно позвони мне"
    ];

    let i = 0;
    const interval = setInterval(() => {
      if (i < messages.length) {
        statusEl.textContent = messages[i];
        i++;
      } else {
        clearInterval(interval);
        createHeart();
      }
    }, 1300);

    function createHeart() {
      const phrase = "Я ЛЮБЛЮ ТЕБЯ";
      const words = Array(60).fill(phrase);

      const centerX = 160;
      const centerY = 200;

      heartEl.innerHTML = '';

      words.forEach((word, index) => {
        const t = (index / words.length) * Math.PI * 2 + 0.12;

        let x = 11 * Math.pow(Math.sin(t), 3);
        let y = 10 * Math.cos(t) - 6.5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

        const scale = 13.2;
        x = centerX + x * scale;
        y = centerY - y * scale * 0.84;

        const el = document.createElement('div');
        el.className = 'word';
        el.textContent = word;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        
        const delay = index * 11;
        el.style.animation = `fadeIn ${2.2 + Math.random() * 1.3}s forwards`;
        el.style.animationDelay = `${delay}ms`;
        
        heartEl.appendChild(el);
      });
    }

    const style = document.createElement('style');
    style.innerHTML = `@keyframes fadeIn { to { opacity: 1; } }`;
    document.head.appendChild(style);
  </script>
</body>
</html>
